name: smart_maid_app
description: "شغّالتي — تطبيق خدمات منزلية ذكية بالذكاء الاصطناعي والبحث الصوتي"
publish_to: 'none'

# إصدار التطبيق
version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.20.2
  pdf: ^3.11.1
  path_provider: ^2.1.5
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  go_router: ^14.6.1
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  image_picker: ^1.1.2
  crypto: ^3.0.6
  geolocator: ^13.0.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1

# ── أيقونة التطبيق ──────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# ── شاشة البداية ────────────────────────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#03045A"
  image: assets/icon/icon_original.png
  branding: assets/icon/icon_original.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#03045A"
    image: assets/icon/icon_original.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#03045A"
  android_gravity: center
  ios_content_mode: center
  web: false
  fullscreen: false

# ── Flutter ─────────────────────────────────────────────────────────
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

