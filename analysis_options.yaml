# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/screens/**
    - lib/l10n/**
    - build/**
  errors:
    # تعامل مع unused_import كـ info فقط (ليس warning)
    unused_import: info
    # deprecated_member_use: يُوجَد كثيراً في packages خارجية
    deprecated_member_use: info
    # curly_braces_in_flow_control_structures
    curly_braces_in_flow_control_structures: info
    # unnecessary_underscores
    unnecessary_underscores: info
    # prefer_final_fields
    prefer_final_fields: info

linter:
  rules:
    # تعطيل القواعد التي تُسبب warnings في CI
    curly_braces_in_flow_control_structures: false
    prefer_final_fields: false
    unnecessary_underscores: false
